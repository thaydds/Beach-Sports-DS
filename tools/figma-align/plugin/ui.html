<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" />
  <style>
    body {
      font: 14px/1.5 system-ui;
      margin: 24px;
    }
    button {
      font: inherit;
      padding: 10px;
      margin: 4px 0;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
  <h1>Alinhar Beach Sports DS</h1>
  <p>
    Renomeia variáveis preservando IDs e valores; vincula geometria e textos dos oito masters Card.
    Não exclui variáveis, não muda textos nem a composição das telas.
  </p>
  <button id="inspect">Conferir arquivo</button>
  <button id="apply" disabled>Aplicar alinhamento</button>
  <pre id="status" role="status">
Execute no modo Design. O plano é específico do export auditado.</pre>
  <script>
    const inspect = document.getElementById('inspect'),
      apply = document.getElementById('apply'),
      status = document.getElementById('status');
    function send(type) {
      inspect.disabled = true;
      apply.disabled = true;
      status.textContent = 'Conferindo…';
      parent.postMessage({ pluginMessage: { type } }, '*');
    }
    inspect.onclick = () => send('inspect');
    apply.onclick = () => send('apply');
    onmessage = (event) => {
      const m = event.data.pluginMessage;
      if (!m) return;
      inspect.disabled = false;
      if (m.type === 'ready') {
        apply.disabled = false;
        status.textContent = `${m.file}\n${m.renames} nomes · ${m.nodes} nós Card · ${m.exceptions} alturas de linha AUTO preservadas.\nValores atuais conferidos. Não edite o arquivo durante a aplicação.`;
      } else if (m.type === 'result') {
        status.textContent = `${m.result.status === 'already-applied' ? 'Alinhamento já aplicado.' : 'Alinhamento aplicado e leitura de retorno conferida.'}\nAgora execute o plugin Audit e envie um novo export para validar o conjunto.`;
      } else status.textContent = m.message;
    };
  </script>
</html>
